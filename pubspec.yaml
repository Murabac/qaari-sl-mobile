name: qaari_sl_mobile
description: Qaari SL — Somali community Quran reciters mobile app.
publish_to: "none"

version: 1.0.3+5

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.2.0
  google_fonts: ^6.2.1
  dio: ^5.8.0+1
  just_audio: ^0.10.4
  audio_service: ^0.18.18
  audio_session: ^0.1.25
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  package_info_plus: ^10.2.1
  path: ^1.9.1
  video_player: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
